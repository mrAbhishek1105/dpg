[workspace]
resolver = "2"
members = [
    "apps/dpg",
    "crates/dpg-core",
    "crates/dpg-detect",
    "crates/dpg-policy",
    "crates/dpg-protect",
    "crates/dpg-restore",
    "crates/dpg-connect",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["DPG Contributors"]
repository = "https://github.com/REPLACE_ME/dpg"

[workspace.dependencies]
dpg-core = { path = "crates/dpg-core" }
dpg-detect = { path = "crates/dpg-detect" }
dpg-policy = { path = "crates/dpg-policy" }
dpg-protect = { path = "crates/dpg-protect" }
dpg-restore = { path = "crates/dpg-restore" }
dpg-connect = { path = "crates/dpg-connect" }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
assert_cmd = "2.0"
predicates = "3.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
