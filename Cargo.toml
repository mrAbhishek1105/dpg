[workspace]
resolver = "2"
members = [
    "apps/dpg",
    "crates/dpg-core",
    "crates/dpg-detect",
    "crates/dpg-policy",
    "crates/dpg-protect",
    "crates/dpg-restore",
    "crates/dpg-connect",
    "tests/fixtures/gen",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["DPG Contributors"]
repository = "https://github.com/REPLACE_ME/dpg"

[workspace.dependencies]
dpg-core = { path = "crates/dpg-core", version = "0.0.1" }
dpg-detect = { path = "crates/dpg-detect", version = "0.0.1" }
dpg-policy = { path = "crates/dpg-policy", version = "0.0.1" }
dpg-protect = { path = "crates/dpg-protect", version = "0.0.1" }
dpg-restore = { path = "crates/dpg-restore", version = "0.0.1" }
dpg-connect = { path = "crates/dpg-connect", version = "0.0.1" }
dpg-testgen = { path = "tests/fixtures/gen", version = "0.0.1" }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.11"
aho-corasick = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
sha2 = "0.10"
hmac = "0.12"
directories = "6.0"
dunce = "1.0"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.17"
proptest = "1.5"
criterion = "0.5"
rand = "0.8"
rand_chacha = "0.3"
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
aes-gcm = "0.10"
subtle = "2.6"
tokio = { version = "1.43", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["limit", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
bytes = "1.10"
futures-util = "0.3"
keyring = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
